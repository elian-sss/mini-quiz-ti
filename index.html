<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mini Quiz de TI com 5 perguntas de múltipla escolha para alunos do ensino médio.">
  <title>Mini Quiz de TI</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="conteudo">
    <h1>Mini Quiz de TI</h1>

    <section class="quiz" aria-labelledby="pergunta">
      <p id="progresso" class="progresso" aria-live="polite">Pergunta 1 de 5</p>

      <h2 id="pergunta" class="pergunta" tabindex="-1">Carregando pergunta…</h2>

      <div id="opcoes" class="opcoes" role="group" aria-labelledby="pergunta">
        <!-- As opções de resposta serão inseridas pelo script.js -->
      </div>

      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

      <button type="button" id="proxima" class="proxima" disabled>Próxima</button>
    </section>

    <noscript>
      <p>Este quiz precisa do JavaScript ativado no navegador para funcionar.</p>
    </noscript>
  </main>
</body>
</html>
